name: Release

on:
    workflow_dispatch:
    push:
        branches:
            - main
        paths:
            - VERSION

permissions:
    contents: write

jobs:
    release:
        name: Publish stable release
        runs-on: ubuntu-latest
        timeout-minutes: 15

        steps:
            - name: Checkout
              uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
              with:
                  fetch-depth: 0

            - name: Read release version
              id: metadata
              shell: bash
              run: |
                  version="$(tr -d '[:space:]' < VERSION)"

                  if [[ ! "$version" =~ ^[0-9]+\.[0-9]+\.[0-9]+([.-][0-9A-Za-z.-]+)?$ ]]; then
                      echo "::error::VERSION does not contain a valid semantic version: $version"
                      exit 1
                  fi

                  echo "version=$version" >> "$GITHUB_OUTPUT"
                  echo "tag=v$version" >> "$GITHUB_OUTPUT"

            - name: Ensure version tag exists
              id: release
              env:
                  TAG: ${{ steps.metadata.outputs.tag }}
              shell: bash
              run: |
                  git fetch --tags --force

                  if git rev-parse "$TAG" >/dev/null 2>&1; then
                      release_commit="$(git rev-list --max-count=1 "$TAG")"
                      echo "Tag $TAG already exists at $release_commit."
                  else
                      git config user.name "github-actions[bot]"
                      git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
                      git tag -a "$TAG" "$GITHUB_SHA" -m "$TAG"
                      git push origin "$TAG"
                      release_commit="$GITHUB_SHA"
                      echo "Created $TAG at $release_commit."
                  fi

                  echo "commit=$release_commit" >> "$GITHUB_OUTPUT"

            - name: Ensure GitHub release exists
              env:
                  GH_TOKEN: ${{ github.token }}
                  TAG: ${{ steps.metadata.outputs.tag }}
              shell: bash
              run: |
                  if gh release view "$TAG" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
                      echo "GitHub release $TAG already exists."
                      exit 0
                  fi

                  gh release create "$TAG" \
                      --repo "$GITHUB_REPOSITORY" \
                      --target "$TAG" \
                      --title "$TAG" \
                      --generate-notes

            - name: Verify Packagist auto-update
              env:
                  RELEASE_TAG: ${{ steps.metadata.outputs.tag }}
                  RELEASE_COMMIT: ${{ steps.release.outputs.commit }}
                  PACKAGE_METADATA_URL: https://repo.packagist.org/p2/codegenie-be/laravel-livewire-multistep-form.json
              shell: bash
              run: |
                  for attempt in $(seq 1 30); do
                      if curl --fail --silent --show-error "$PACKAGE_METADATA_URL" \
                          | jq --exit-status \
                              --arg tag "$RELEASE_TAG" \
                              --arg commit "$RELEASE_COMMIT" \
                              '.packages["codegenie-be/laravel-livewire-multistep-form"] | any(.version == $tag and .source.reference == $commit)' >/dev/null 2>&1; then
                          echo "Packagist exposes $RELEASE_TAG at $RELEASE_COMMIT."
                          exit 0
                      fi

                      echo "Waiting for Packagist auto-update (${attempt}/30)..."
                      sleep 10
                  done

                  echo "::error::Packagist did not expose $RELEASE_TAG at $RELEASE_COMMIT within five minutes. For the first publication, submit https://github.com/Codegenie-BE/laravel-livewire-multistep-form once on Packagist and enable its GitHub auto-update integration."
                  exit 1

            - name: Delete every non-main branch
              if: always()
              shell: bash
              run: |
                  git ls-remote --heads origin \
                      | awk '{print $2}' \
                      | sed 's#refs/heads/##' \
                      | while IFS= read -r branch; do
                          if [[ -z "$branch" || "$branch" == "main" ]]; then
                              continue
                          fi

                          echo "Deleting branch: $branch"
                          git push origin --delete "$branch" || echo "::warning::Could not delete branch $branch"
                      done
