name: Tests

on:
    pull_request:
    push:
        branches:
            - main

permissions:
    contents: read

jobs:
    tests:
        runs-on: ubuntu-latest

        steps:
            - name: Checkout
              uses: actions/checkout@v4

            - name: Setup PHP
              uses: shivammathur/setup-php@v2
              with:
                  php-version: '8.3'
                  coverage: none
                  tools: composer:v2

            - name: Install dependencies
              run: composer install --no-interaction --no-progress --prefer-dist

            - name: Run tests
              run: composer test

            - name: Check formatting
              run: composer format
